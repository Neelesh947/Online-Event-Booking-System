<div class="login-wrapper">
  <mat-card class="login-card">
    <h2 class="title">🔐 Welcome Back</h2>
    <p class="subtitle">Login to your account to explore events</p>

    <form (ngSubmit)="login()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="userName" name="email" placeholder="example@mail.com" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width">Login</button>
    </form>

    <div class="helper-links">
      <a href="#">Forgot Password?</a>
      <span> | </span>
      <a routerLink="/sign-up">Create Account</a>
    </div>
  </mat-card>
</div>
