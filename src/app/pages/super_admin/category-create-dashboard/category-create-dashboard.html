<div class="category-container">
  <h2>Create New Category</h2>

  <form (ngSubmit)="createCategory()" #categoryForm="ngForm">
    <div class="form-group">
      <label for="name">Category Name</label>
      <input
        type="text"
        id="name"
        name="name"
        class="form-control"
        [(ngModel)]="category.name"
        required
        placeholder="Enter category name"
      />
    </div>

    <div *ngIf="message" [class.error]="isError" [class.success]="!isError" class="message">
      {{ message }}
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="categoryForm.invalid" class="btn btn-primary">Create</button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">← Back</button>
    </div>
  </form>

  <hr />

  <h3>Available Categories</h3>
  <ul class="category-list">
    <li *ngFor="let cat of categories">
      📂 {{ cat.name }}
    </li>
  </ul>
</div>
